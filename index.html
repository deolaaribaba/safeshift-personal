<!DOCTYPE html>
<html>

<head>
  <title>SafeShift</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;

    }
    h1 {
      color: #333;
    }
    button {
      background: #d32f2f;
      color: whitesmoke;
      border: none;
      padding: 20px 40px;
      font-size: 20px;
      border-radius: 12px;
      cursor: pointer;
    }
    #startBtn { background:#2e7d32; }
#endBtn { background:#d32f2f; }
#clearBtn { background:#555555; }  
    button:disabled {
      background: #999999;
      color: #666666;
      cursor: not-allowed;
      opacity: 0.6;
    }
    </style>
   
  </head>
  <body>
    <h1>SafeShift Personal</h1>
    <button id="startBtn" onclick="startShift()">Start Shift</button>
    <button id="endBtn" onclick="endShift()" disabled>End Shift</button>
    <button id="clearBtn" onclick="clearShifts()" style="background:#555;color:white;padding:15px 30px;margin:10px;font-size:18px;border:none;border-radius:8px;">Clear All</button>
    <p id="status"></p>
    <ul id="shiftList"></ul>

<script>
 function startShift() {
  const startTime = new Date().toISOString();
  localStorage.setItem('currentShift' , startTime);
  document.getElementById('startBtn').disabled = true;
  document.getElementById('endBtn').disabled = false;
  document.getElementById('status').innerText = 'Shift started: ' + new Date(startTime).toLocaleString();

 }

 function endShift() {
  const startTime =localStorage.getItem('currentShift');
  const endTime = new Date().toISOString();
  const start = new Date(startTime);
  const end = new Date(endTime);
  const minutes= Math.round((end-start) / 1000 / 60);
  const shifts = JSON.parse(localStorage.getItem('shifts') || '[]');
  shifts.push({start: startTime, end: endTime, minutes: minutes});
  localStorage.setItem('shifts', JSON.stringify(shifts));

  const list = document.getElementById('shiftList');
  list.innerHTML = '';
  shifts.forEach(s => {
    const li = document.createElement('li');
    const h = Math . floor(s.minutes / 60);
    const m = s.minutes % 60;
    li.innerText = new Date(s.start).toLocaleString() + ' - ' + h + 'h' + m + 'm';
    list.appendChild(li);
  });
 
  localStorage.removeItem('currentShift');
  document.getElementById('startBtn').disabled = false;
  document.getElementById('endBtn').disabled =true;
  document.getElementById('status').innerText = 'Shift ended. Worked ' + minutes + ' minutes.';
 }
 
 function clearShifts() {
  if(confirm('Delete all saved shifts?')) {
    localStorage.removeItem('shifts');
    document.getElementById('shiftList').innerHTML = '';
    document.getElementById('status').innerText = 'All shifts cleared.'; 
  }
 }
 
 
 
  
 
</script>
  </body>
  </html>
